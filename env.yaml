name: greek_movement
channels:
  - conda-forge
  - pytorch
  - defaults
dependencies:
  - python=3.9
  - matplotlib=3.5.1
  #- numpy=2.2.1 # previous version - not compatible with rest
  #- pandas=2.2.3 # previous version - not compatible with rest
  - numpy=1.21.5
  - pandas=1.4.2
  - scipy=1.9.0
  - seaborn=0.11.2
  - pip=20.3.3
  - spyder-kernels=2.5 # optional for the spyder IDE
  - spyder=5.5.3    # optional for the spyder IDE
  - ipykernel
  - numpy
  - pandas
  - pytorch = 2.2.0
  - tqdm
  - scikit-learn = 1.5.2
  - pip:
      - ipdb
      - transformers
      - accelerate
      - pyarrow==18.1.0
      - python-dateutil==2.9.0.post0
      - pytz==2024.2
      - six==1.17.0
      - tzdata==2024.2
