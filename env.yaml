name: greek_movement
channels:
  - pytorch
  - conda-forge
dependencies:
  # Core
  - python=3.11

  # Scientific stack (compatible with modern PyTorch / sklearn)
  - numpy>=1.26,<2.0
  - scipy>=1.11,<2.0
  - pandas>=2.1,<3.0
  - matplotlib>=3.8,<4.0
  - seaborn>=0.13,<0.14
  - scikit-learn>=1.4,<2.0
  - tqdm

  # PyTorch (CPU by default on macOS arm64; works with MPS)
  - pytorch=2.2.*

  # Jupyter kernel
  - ipykernel

  # Keep pip but don't pin it old
  - pip>=23

  # Optional IDE tooling (Spyder) — note Spyder can be picky; if this fails, split envs
  - spyder>=5.5,<6
  - spyder-kernels>=2.5,<3

  - pip:
      - ipdb
      - transformers
      - accelerate
      - pyarrow==18.1.0
      - python-dateutil==2.9.0.post0
      - pytz==2024.2
      - six==1.17.0
      - tzdata==2024.2
      - mne
      - prettytable